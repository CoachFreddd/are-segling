/* ══════════════════════════════════════════════
   BOAT CAPACITY MODEL
   - 2 båtar, max 3 pers/båt
   - Heldag blockerar en båt hela dagen (fm+em)
   - Halvdag fm/em blockerar en båt halv dag
   - Båtar delas mellan produkttyper (halvdag+heldag)
   
   Vi räknar per datum hur många "båthalvdagar" som är tagna:
   Varje båt har 2 slots per dag: FM och EM.
   Total kapacitet: 2 båtar × 2 slots = 4 båt-slots/dag.
   Heldag tar BÅDA slots på en båt (FM+EM).
   Halvdag tar ett slot.
   
   En booking "kräver" ceil(persons/3) båtar per slot.
══════════════════════════════════════════════ */
var BOATS=2, MAX_PER_BOAT=4;

/* Return how many boats are needed for N persons */
function boatsNeeded(persons){return Math.ceil(persons/MAX_PER_BOAT);}

/* For a given date, compute how many boats are occupied per slot.
   Returns {fm: X, em: Y}  where X,Y are number of boats taken (0-2).
   Match on dateISO field. */
function boatUsage(isoStr){
  var fm=0, em=0;
  S.bookings.forEach(function(b){
    if(b.dateISO!==isoStr) return;
    var n=boatsNeeded(b.persons);
    if(b.type==='heldag'||b.type==='privat'){
      fm+=n; em+=n;
    } else if(b.type==='halvdag'){
      if(b.time==='Förmiddag 09–13') fm+=n;
      else em+=n;
    } else {
      fm+=n; em+=n;
    }
  });
  return {fm:Math.min(fm,BOATS), em:Math.min(em,BOATS)};
}

/* Can we fit 'persons' on a given date+time?
   type: 'halvdag'|'heldag'|'privat'|'kurs'
   time: 'Förmiddag 09–13'|'Eftermiddag 14–18'|null */
function canBook(type, dateStr, timeStr, persons){
  var need=boatsNeeded(persons);
  var usage=boatUsage(dateStr);
  if(type==='heldag'||type==='privat'||type==='kurs'){
    /* needs same boat(s) free both fm and em */
    return (BOATS-usage.fm>=need) && (BOATS-usage.em>=need);
  } else {
    /* halvdag — only one slot */
    var slot=timeStr==='Förmiddag 09–13'?usage.fm:usage.em;
    return (BOATS-slot)>=need;
  }
}

/* Boats left for a slot */
function boatsLeft(dateStr, slot){
  var usage=boatUsage(dateStr);
  return Math.max(0, BOATS-(slot==='fm'?usage.fm:usage.em));
}

/* Persons capacity left for a slot (considering partial bookings) */
function spotsLeftForSlot(dateStr, slot){
  var usage=boatUsage(dateStr);
  var takenBoats=slot==='fm'?usage.fm:usage.em;
  var freeBoats=Math.max(0,BOATS-takenBoats);
  /* also check how many persons on partially filled boats */
  var partialPersons=0;
  S.bookings.forEach(function(b){
    if(b.date!==dateStr) return;
    var isFm=(b.type!=='halvdag')||(b.time==='Förmiddag 09–13');
    var isEm=(b.type!=='halvdag')||(b.time!=='Förmiddag 09–13');
    var matches=slot==='fm'?isFm:isEm;
    if(matches) partialPersons+=b.persons%MAX_PER_BOAT;
  });
  return freeBoats*MAX_PER_BOAT + (partialPersons>0?MAX_PER_BOAT-partialPersons:0);
}

/* closed dates: stored as Set of "YYYY-MM-DD" strings, keyed globally */
var DEFAULT_CLOSED=lsGet('are_closed',[]);
var S_closed=new Set(DEFAULT_CLOSED); /* ISO date strings blocked by admin */

function isClosed(isoDate){return S_closed.has(isoDate);}
function toggleClosed(isoDate){
  if(S_closed.has(isoDate)) S_closed.delete(isoDate);
  else S_closed.add(isoDate);
  lsSet('are_closed',Array.from(S_closed));
}

/* Generate all dates in a range for booking */
function datesInRange(startISO, endISO){
  var out=[], d=new Date(startISO), e=new Date(endISO);
  while(d<=e){out.push(new Date(d));d.setDate(d.getDate()+1);}
  return out;
}

var MONTHS=['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];
function fmtDate(d){return DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()];}
function isoDate(d){return d.toISOString().slice(0,10);}

/* Always merge stored products with defaults — defaults win on imgFile */
var DATA_VERSION = '3'; /* bump this to force-refresh products from defaults */
function mergeProducts(stored, defaults){
  if(!stored||!stored.length) return JSON.parse(JSON.stringify(defaults));
  return defaults.map(function(def){
    var found=stored.find(function(s){return s.id===def.id;});
    if(!found) return JSON.parse(JSON.stringify(def));
    /* always take imgFile from defaults so Netlify paths work */
    found.imgFile = def.imgFile;
    /* keep fixedDates from defaults */
    if(def.fixedDates) found.fixedDates = def.fixedDates;
    /* carry longDesc from stored if exists, else use default */
    if(!found.longDesc && def.longDesc) found.longDesc = def.longDesc;
    return found;
  }).concat(stored.filter(function(s){
    return !defaults.find(function(d){return d.id===s.id;});
  }));
}

/* ── DOM builder ── */
function h(tag,attrs,children){
  var el=document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(function(k){
    if(k==='style') el.style.cssText=attrs[k];
    else if(k.startsWith('on')) el[k]=attrs[k];
    else el.setAttribute(k,attrs[k]);
  });
  if(children){
    if(!Array.isArray(children)) children=[children];
    children.forEach(function(c){
      if(c==null||c===false) return;
      el.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c);
    });
  }
  return el;
}

  if(S.confirmDelete) app.appendChild(renderConfirmDialog());
  if(S.editSkipper) app.appendChild(renderEditSkipperDialog());
}

/* ══════════════ BOOKING MODAL ══════════════ */

      h('button',{style:CS.btnPrimary+';margin-top:1.5rem',onclick:function(){S.modal=null;render();}},['Stäng'])
    ]));

  }

  /* ── Step 1: antal vuxna + barn ── */
  var CHILD_PRICE=500;
  mb.appendChild(h('label',{style:CS.label},['Antal personer']));
  var personsWrap=h('div',{style:'background:#f9f7f4;border-radius:10px;padding:.85rem 1rem;margin-bottom:1.2rem;display:flex;flex-direction:column;gap:.75rem'});

  /* adults row */
  var adultRow=h('div',{style:'display:flex;align-items:center;justify-content:space-between'});
  var adultL=h('div',{});
  adultL.appendChild(h('div',{style:'font-size:.85rem;font-weight:500;color:'+stone},['Vuxna']));
  adultL.appendChild(h('div',{style:'font-size:.72rem;color:'+muted},[p.price.toLocaleString('sv-SE')+' kr / pers']));
  adultRow.appendChild(adultL);
  var adultCtrl=h('div',{style:'display:flex;align-items:center;gap:10px'});
  function mkQ(d){return h('button',{style:'width:30px;height:30px;border-radius:50%;border:1.5px solid #d4c9b4;background:'+white+';cursor:pointer;font-size:1rem;flex-shrink:0',onclick:function(){
    var max=BOATS*MAX_PER_BOAT;
    S.booking.persons=Math.max(1,Math.min(max,S.booking.persons+d));
    S.booking.dateISO=null;S.booking.dateLabel='';render();
  }},[d<0?'−':'+']);}
  adultCtrl.appendChild(mkQ(-1));
  adultCtrl.appendChild(h('span',{style:'font-size:1.2rem;min-width:24px;text-align:center;font-weight:500;color:'+stone},[String(S.booking.persons)]));
  adultCtrl.appendChild(mkQ(1));
  adultRow.appendChild(adultCtrl);
  personsWrap.appendChild(adultRow);

  /* divider */
  personsWrap.appendChild(h('div',{style:'height:1px;background:#e2edf2'}));

  /* children row */
  var childRow=h('div',{style:'display:flex;align-items:center;justify-content:space-between'});
  var childL=h('div',{});

  childL.appendChild(h('div',{style:'font-size:.72rem;color:'+muted},[CHILD_PRICE.toLocaleString('sv-SE')+' kr / barn']));
  childRow.appendChild(childL);
  var childCtrl=h('div',{style:'display:flex;align-items:center;gap:10px'});
  function mkC(d){return h('button',{style:'width:30px;height:30px;border-radius:50%;border:1.5px solid #d4c9b4;background:'+white+';cursor:pointer;font-size:1rem;flex-shrink:0',onclick:function(){
    S.booking.children=Math.max(0,Math.min(BOATS*MAX_PER_BOAT,S.booking.children+d));
    render();
  }},[d<0?'−':'+']);}
  childCtrl.appendChild(mkC(-1));
  childCtrl.appendChild(h('span',{style:'font-size:1.2rem;min-width:24px;text-align:center;font-weight:500;color:'+stone},[String(S.booking.children)]));
  childCtrl.appendChild(mkC(1));
  childRow.appendChild(childCtrl);
  personsWrap.appendChild(childRow);

  /* capacity hint */
  var totalPassengers=S.booking.persons+(S.booking.children||0);
  personsWrap.appendChild(h('div',{style:'font-size:.72rem;color:'+muted+';text-align:right'},

  mb.appendChild(personsWrap);

  /* ── Step 2: time first for halvdag (affects date availability) ── */
  if(p.hasTime){
    mb.appendChild(h('label',{style:CS.label},['Tid på dagen']));
    var tr=h('div',{style:'display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1.2rem'});
    [{k:'Förmiddag 09–13',l:'Förmiddag',s:'09:00–13:00'},{k:'Eftermiddag 14–18',l:'Eftermiddag',s:'14:00–18:00'}].forEach(function(t){

      ]));

    mb.appendChild(tr);

  /* ── Step 3: date picker ── */
  mb.appendChild(h('label',{style:CS.label},['Välj datum']));

    var dg=h('div',{style:'display:flex;flex-direction:column;gap:6px;margin-bottom:1.2rem'});
    p.fixedDates.forEach(function(fd){
      if(isClosed(fd.iso)) return;
      var sel=S.booking.dateISO===fd.iso;
      var avail=canBook(p.id,fd.label,null,S.booking.persons);
      dg.appendChild(h('div',{
        style:'padding:10px 13px;border-radius:10px;border:1.5px solid '+(sel?navy:avail?'#d4c9b4':'#f0d0d0')+';background:'+(sel?navy:avail?white:'#fdf5f5')+';cursor:'+(avail?'pointer':'not-allowed')+';font-size:.875rem;display:flex;align-items:center;justify-content:space-between',
        onclick:function(){if(avail){S.booking.dateISO=fd.iso;S.booking.dateLabel=fd.label;S.booking._err=null;render();}}
      },[h('span',{style:'color:'+(sel?white:avail?stone:muted)},[fd.label]),
         h('span',{style:'font-size:.7rem;padding:2px 8px;border-radius:50px;background:'+(sel?'rgba(255,255,255,.15)':avail?'#e2edf2':'#fde8e8')+';color:'+(sel?white:avail?water:'#c0392b')},[avail?'Tillgängligt':'Fullbokat']),
         sel?h('span',{style:'margin-left:6px;color:'+white},['✓']):'']));
    });
    mb.appendChild(dg);
  } else {
    /* Dynamic dates: generate from season, skip closed & fully booked */
    var allDates=datesInRange(isoDate(SEASON_START),isoDate(SEASON_END));
    /* show next 30 available days */
    var shown=0;
    var dg2=h('div',{style:'display:flex;flex-direction:column;gap:5px;margin-bottom:1.2rem;max-height:230px;overflow-y:auto;padding-right:4px'});
    var timeKey = p.hasTime ? S.booking.time : null;
    var needTime = p.hasTime && !S.booking.time;

    allDates.forEach(function(d){
      if(shown>=30) return;
      var iso=isoDate(d);
      if(isClosed(iso)) return;
      /* can we book this? */
      var avail=canBook(p.id,iso,timeKey,S.booking.persons);
      if(!avail&&shown>10) return; /* show some full dates for transparency */
      var label=fmtDate(d);
      var sel=S.booking.dateISO===iso;
      /* boats left indicator */
      var slot=p.hasTime?(S.booking.time==='Förmiddag 09–13'?'fm':'em'):'fm';
      var bl=boatsLeft(iso,slot);
      var blEm=boatsLeft(iso,'em');
      var blBoth=Math.min(bl,blEm);
      var boatsAvail=p.hasTime?bl:blBoth;

      var badgeTxt, badgeColor, badgeBg;
      if(!avail){badgeTxt='Fullbokat';badgeColor='#c0392b';badgeBg='#fde8e8';}
      else if(boatsAvail===1){badgeTxt='1 båt kvar';badgeColor='#92400e';badgeBg='#fef3c7';}
      else{badgeTxt=boatsAvail+' båtar lediga';badgeColor=water;badgeBg='#e2edf2';}
      if(sel){badgeColor=white;badgeBg='rgba(255,255,255,.2)';}

      dg2.appendChild(h('div',{
        style:'padding:9px 12px;border-radius:10px;border:1.5px solid '+(sel?navy:avail?'#d4c9b4':'#f0d0d0')+';background:'+(sel?navy:avail?white:'#fdf5f5')+';cursor:'+(avail&&!needTime?'pointer':'not-allowed')+';display:flex;align-items:center;justify-content:space-between;opacity:'+(needTime?.5:1),

      },[
        h('span',{style:'font-size:.875rem;color:'+(sel?white:avail?stone:muted)},[label]),

        sel?h('span',{style:'margin-left:6px;color:'+white},['✓']):''

    mb.appendChild(dg2);

  /* ── name + phone ── */

  var ni=h('input',{style:CS.input+';margin-bottom:.9rem',placeholder:'För- och efternamn',value:S.booking.name,type:'text'});ni.oninput=function(){S.booking.name=this.value;};mb.appendChild(ni);
  mb.appendChild(h('label',{style:CS.label},['Mobilnummer']));

  /* ── summary ── */
  var isFixed=p.unit==='tillfälle';
  var CHILD_PRICE2=500;
  var children=S.booking.children||0;
  var adultTotal=p.price*(isFixed?1:S.booking.persons);
  var childTotal=CHILD_PRICE2*children;
  var total=adultTotal+childTotal;
  var sumBox=h('div',{style:'background:#f0f5f8;border:1px solid '+glacier+';border-radius:10px;padding:1rem 1.25rem;margin-bottom:1.2rem'});
  sumBox.appendChild(h('div',{style:'display:flex;justify-content:space-between;font-size:.85rem;color:'+muted+';margin-bottom:4px'},
    [isFixed?'Tillfälle':'Vuxna ('+S.booking.persons+' × '+p.price.toLocaleString('sv-SE')+' kr)', adultTotal.toLocaleString('sv-SE')+' kr']));
  if(children>0) sumBox.appendChild(h('div',{style:'display:flex;justify-content:space-between;font-size:.85rem;color:'+muted+';margin-bottom:4px'},
    ['Barn ('+children+' × '+CHILD_PRICE2.toLocaleString('sv-SE')+' kr)', childTotal.toLocaleString('sv-SE')+' kr']));
  sumBox.appendChild(h('div',{style:'display:flex;justify-content:space-between;font-size:1rem;font-weight:500;color:'+stone+';border-top:1px solid '+glacier+';padding-top:8px;margin-top:6px'},
    ['Totalt',total.toLocaleString('sv-SE')+' kr']));
  mb.appendChild(sumBox);

  var swish=h('div',{style:'background:#e8f4fb;border:1px solid #b5d4f4;border-radius:10px;padding:1rem 1.25rem;margin-bottom:1.2rem;display:flex;align-items:center;gap:12px'});
  swish.appendChild(h('div',{style:'width:40px;height:40px;border-radius:8px;background:linear-gradient(135deg,#00b4d8,#0096c7);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.1rem'},['💙']));
  var swt=h('div',{});swt.appendChild(h('div',{style:'font-size:.85rem;font-weight:500;color:'+stone+';margin-bottom:2px'},['Betalning via Swish']));swt.appendChild(h('div',{style:'font-size:.78rem;color:'+muted},['Swisha beloppet till:']));swt.appendChild(h('div',{style:'font-size:.95rem;font-weight:500;color:'+water+';margin-top:3px'},['123 456 78 90']));swish.appendChild(swt);mb.appendChild(swish);
  mb.appendChild(h('p',{style:'color:'+muted+';font-size:.78rem;line-height:1.55;margin-bottom:1rem'},['Swisha beloppet med ditt namn. Vi bekräftar inom 24 h via SMS.']));
  if(S.booking._err) mb.appendChild(h('div',{style:'color:#c0392b;font-size:.8rem;margin-bottom:.75rem;padding:8px 12px;background:#fef2f2;border-radius:8px'},[S.booking._err]));

  mb.appendChild(h('button',{style:CS.btnPrimary+';width:100%;padding:13px',onclick:function(){
    if(!S.booking.dateISO){S.booking._err='Välj ett datum';render();return;}

    if(!S.booking.phone.trim()||S.booking.phone.length<7){S.booking._err='Ange ett giltigt mobilnummer';render();return;}
    if(!canBook(p.id,S.booking.dateISO,S.booking.time,S.booking.persons)){S.booking._err='Tyvärr hinner någon annan boka precis nu. Välj annat datum.';render();return;}
    var bk={id:'BK'+Date.now(),type:p.id,title:p.name,dateISO:S.booking.dateISO,date:S.booking.dateLabel,time:p.hasTime?S.booking.time:'Heldag',persons:S.booking.persons,children:S.booking.children||0,name:S.booking.name.trim(),phone:S.booking.phone.trim(),total:total,confirmed:false,skippers:[],createdAt:new Date().toISOString()};
    S.bookings.unshift(bk);save();
    S.booking._success=true;S.booking._total=total;render();
  }},['Bekräfta bokning']));
  box.appendChild(mb);return overlay;
}

/* ── calendar ── */
function renderCalendar(){
  var months=['Januari','Februari','Mars','April','Maj','Juni','Juli','Augusti','September','Oktober','November','December'];

  /* legend */

    var l=h('div',{style:'display:flex;align-items:center;gap:5px'});

  });
  wrap.appendChild(leg);

  var cnav=h('div',{style:'display:flex;align-items:center;justify-content:space-between;margin-bottom:12px'});
  cnav.appendChild(h('button',{style:CS.btnSm+';width:34px;height:34px;padding:0',onclick:function(){S.calMonth--;if(S.calMonth<0){S.calMonth=11;S.calYear--;}render();}},['‹']));
  cnav.appendChild(h('div',{style:'font-weight:500;font-size:15px'},[months[S.calMonth]+' '+S.calYear]));
  cnav.appendChild(h('button',{style:CS.btnSm+';width:34px;height:34px;padding:0',onclick:function(){S.calMonth++;if(S.calMonth>11){S.calMonth=0;S.calYear++;}render();}},['›']));
  wrap.appendChild(cnav);

  var cg=h('div',{style:'background:'+white+';border:1px solid #e2edf2;border-radius:14px;overflow:hidden'});
  var dow=h('div',{style:'display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid #e2edf2'});
  ['Mån','Tis','Ons','Tor','Fre','Lör','Sön'].forEach(function(d){dow.appendChild(h('div',{style:'text-align:center;padding:8px 2px;font-size:.68rem;color:'+muted+';font-weight:500;text-transform:uppercase;letter-spacing:.06em'},[d]));});
  cg.appendChild(dow);

  var days=h('div',{style:'display:grid;grid-template-columns:repeat(7,1fr)'});
  var first=new Date(S.calYear,S.calMonth,1);
  var startDow=(first.getDay()+6)%7;
  var dim=new Date(S.calYear,S.calMonth+1,0).getDate();
  var prevDim=new Date(S.calYear,S.calMonth,0).getDate();
  var today=new Date(); today.setHours(0,0,0,0);

  for(var i=startDow-1;i>=0;i--) days.appendChild(h('div',{style:'min-height:80px;padding:4px;font-size:.8rem;color:#d4c9b4;border:0.5px solid #e2edf2;background:#f9f7f4'},[String(prevDim-i)]));

  for(var d=1;d<=dim;d++){
    var dObj=new Date(S.calYear,S.calMonth,d);
    var iso=isoDate(dObj);
    var isPast=dObj<today;
    var isToday=dObj.getTime()===today.getTime();
    var closed=isClosed(iso);
    var usage=boatUsage(iso);
    var fmFull=usage.fm>=BOATS, emFull=usage.em>=BOATS;
    var bothFull=fmFull&&emFull;
    var oneFree=!bothFull&&(usage.fm>=1||usage.em>=1);

    /* bookings on this day */
    var dayBks=S.bookings.filter(function(b){return b.dateISO===iso||(b.date&&b.date.includes(String(d)&&b.date.includes(MONTHS[S.calMonth])));});
    /* more robust: match by iso */
    dayBks=S.bookings.filter(function(b){return b.dateISO===iso;});

    var bg=isPast?'#f9f7f4':closed?'#e8f0f5':bothFull?'#fee2e2':oneFree?'#fef9e7':'#f0fff4';
    var cell=h('div',{style:'min-height:80px;padding:4px;border:0.5px solid #e2edf2;background:'+bg+';cursor:'+(isPast?'default':'pointer'),
      onclick:function(isoCapture){return function(){if(!isPast){toggleClosed(isoCapture);render();}};}(iso)
    });

    var dnStyle='width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.78rem;margin-bottom:2px;background:'+(isToday?navy:'transparent')+';color:'+(isToday?white:isPast?'#bbb':stone);
    cell.appendChild(h('div',{style:dnStyle},[String(d)]));

    if(closed&&!isPast) cell.appendChild(h('div',{style:'font-size:.6rem;color:#4a7fa0;background:#c8d8e0;border-radius:3px;padding:1px 4px;margin-bottom:2px'},['Stängd']));

    /* show bookings */
    dayBks.forEach(function(bk){
      var typeColor={'halvdag':'#4a7fa0','heldag':'#27ae60','kurs':'#8b5cf6','privat':'#f59e0b'}[bk.type]||'#888';
      var label=({'halvdag':'Halvdag','heldag':'Heldag','kurs':'Kurs','privat':'Privat'}[bk.type]||bk.type);
      var timeShort=bk.time==='Förmiddag 09–13'?'FM':bk.time==='Eftermiddag 14–18'?'EM':bk.time==='Heldag'?'HD':'';
      cell.appendChild(h('div',{style:'font-size:.6rem;background:'+typeColor+';color:#fff;border-radius:3px;padding:1px 4px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'},
        [timeShort+' '+bk.name.split(' ')[0]+' ('+bk.persons+'p)']));
    });

    days.appendChild(cell);
  }

  var rem=(7-(startDow+dim)%7)%7;
  for(var j=1;j<=rem;j++) days.appendChild(h('div',{style:'min-height:80px;padding:4px;font-size:.8rem;color:#d4c9b4;border:0.5px solid #e2edf2;background:#f9f7f4'},[String(j)]));
  cg.appendChild(days);

  wrap.appendChild(cg);
  wrap.appendChild(h('p',{style:'font-size:.78rem;color:'+muted+';margin-top:10px'},['Klicka på ett datum för att stänga/öppna det. Bokningar visas med typ och tid.']));
  return wrap;
}

/* ── schema ── */
function renderSchema(){
  var wrap=h('div',{});

    wrap.appendChild(h('div',{style:'text-align:center;padding:3rem;color:'+muted+';background:'+white+';border-radius:14px;border:1px solid #e2edf2'},['Lägg till besättning under fliken Skeppare']));

  }
  if(!S.selectedPerson) S.selectedPerson=allCrew[0].id;
  var person=allCrew.find(function(s){return s.id===S.selectedPerson;})||allCrew[0];

  /* picker */
  var pickerWrap=h('div',{style:'display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1.5rem'});
  allCrew.forEach(function(sk){
    var active=S.selectedPerson===sk.id;

    var btn=h('button',{
      style:'display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:50px;border:1.5px solid '+(active?navy:'#d4c9b4')+';background:'+(active?navy:white)+';cursor:pointer;font-family:Outfit,sans-serif;font-size:.85rem;font-weight:'+(active?'500':'400')+';color:'+(active?white:stone),
      onclick:function(){S.selectedPerson=sk.id;render();}
    });
    btn.appendChild(h('div',{style:'width:26px;height:26px;border-radius:50%;background:'+(active?'rgba(255,255,255,.15)':(isHelm?'#fef3c7':'#e2edf2'))+';display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:600;color:'+(active?white:(isHelm?'#92400e':water))},[ini]));
    btn.appendChild(h('span',{},[sk.name]));
    if(!active) btn.appendChild(h('span',{style:'font-size:.68rem;padding:1px 7px;border-radius:50px;background:'+(isHelm?'#fef3c7':'#e2edf2')+';color:'+(isHelm?'#92400e':water)},[isHelm?'Rorsman':'Skeppare']));

  });
  wrap.appendChild(pickerWrap);

  /* person's bookings sorted chronologically */
  var myBookings=S.bookings.filter(function(b){
    return (b.skippers||[]).includes(person.name);
  }).slice().sort(function(a,b){
    var da=a.dateISO||'9999', db=b.dateISO||'9999';
    if(da!==db) return da.localeCompare(db);
    return (a.time||'').localeCompare(b.time||'');
  });

  /* person header */
  var isHelm=person.role==='helmsman';
  var ini=(person.name||'').split(' ').map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase();

  var hi=h('div',{style:'flex:1'});
  hi.appendChild(h('div',{style:'font-family:"Cormorant Garamond",serif;font-size:1.3rem;font-weight:400;color:'+white},[person.name]));
  var subRow=h('div',{style:'display:flex;align-items:center;gap:10px;margin-top:4px'});
  subRow.appendChild(h('span',{style:'font-size:.72rem;padding:2px 9px;border-radius:50px;background:'+(isHelm?'#fef3c7':'rgba(200,216,224,.2)')+';color:'+(isHelm?'#92400e':glacier)},[isHelm?'Rorsman':'Skeppare']));
  if(person.age) subRow.appendChild(h('span',{style:'font-size:.78rem;color:rgba(255,255,255,.5)'},[person.age+' år']));
  subRow.appendChild(h('span',{style:'font-size:.78rem;color:rgba(255,255,255,.5)'},[myBookings.length+' pass']));
  hi.appendChild(subRow);
  if(person.notes) hi.appendChild(h('div',{style:'font-size:.78rem;color:rgba(255,255,255,.45);margin-top:4px;font-style:italic'},[person.notes]));
  hCard.appendChild(hi);

  var eCol=h('div',{style:'text-align:right;flex-shrink:0'});
  eCol.appendChild(h('div',{style:'font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.4);margin-bottom:3px'},['Bokningsvärde']));
  eCol.appendChild(h('div',{style:'font-family:"Cormorant Garamond",serif;font-size:1.5rem;font-weight:600;color:'+glacier},[totalVal.toLocaleString('sv-SE')+' kr']));
  hCard.appendChild(eCol);

    return wrap;

  /* group by date */
  var grouped={};

    grouped[key].push(b);

    dayBks.forEach(function(bk){
      var colleagues=(bk.skippers||[]).filter(function(n){return n!==person.name;});

      var typeLabel={'halvdag':'Halvdag','heldag':'Heldag','kurs':'Kurs','privat':'Privat'}[bk.type]||bk.title;

      var card=h('div',{style:'background:'+white+';border:1px solid #e2edf2;border-radius:12px;padding:1rem 1.25rem;margin-bottom:8px;border-left:3px solid '+(bk.confirmed?'#27ae60':'#d4c9b4')});

      badges.appendChild(h('span',{style:'font-size:.7rem;padding:2px 9px;border-radius:50px;font-weight:500;background:'+typeColor+'22;color:'+typeColor},[typeLabel]));
      badges.appendChild(h('span',{style:'font-size:.7rem;padding:2px 9px;border-radius:50px;background:'+(bk.confirmed?'#d1fae5':'#fef3c7')+';color:'+(bk.confirmed?'#065f46':'#92400e')},[bk.confirmed?'Bekräftad':'Väntar bekräftelse']));
      tl.appendChild(badges);

      top.appendChild(tl);
      var tr=h('div',{style:'text-align:right;flex-shrink:0'});
      tr.appendChild(h('div',{style:'font-size:1.05rem;font-weight:500;color:'+navy},[bk.total.toLocaleString('sv-SE')+' kr']));
      top.appendChild(tr);
      card.appendChild(top);

      /* colleagues */
      if(colleagues.length){
        var cr=h('div',{style:'display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding-top:.6rem;border-top:1px solid #f0f5f8'});
        cr.appendChild(h('span',{style:'font-size:.72rem;color:'+muted},'Jobbar med:'));
        colleagues.forEach(function(cname){
          var csk=S.skippers.find(function(s){return s.name===cname;})||{};
          var ch=csk.role==='helmsman';
          cr.appendChild(h('span',{style:'font-size:.72rem;padding:2px 9px;border-radius:50px;background:'+(ch?'#fef3c7':'#e2edf2')+';color:'+(ch?'#92400e':water)},
            [(ch?'🧭 ':'⚓ ')+cname+(ch?' (Rorsman)':' (Skeppare)')]));
        });
        card.appendChild(cr);
      }
      wrap.appendChild(card);
    });
  });
  return wrap;
}


/* ── statistik ── */
function renderStatistik(){
  var wrap=h('div',{});
  var today=new Date(); today.setHours(0,0,0,0);

  if(!S.skippers.length){
    wrap.appendChild(h('div',{style:'text-align:center;padding:3rem;color:#7a7a76;background:#fff;border-radius:14px;border:1px solid #e2edf2'},['Lägg till besättning under fliken Skeppare']));
    return wrap;
  }

  /* sort: skippers first, then helmsmen, both alphabetical */
  var crew=S.skippers.slice().sort(function(a,b){
    if(a.role===b.role) return a.name.localeCompare(b.name,'sv');
    return a.role==='skipper'?-1:1;
  });

  crew.forEach(function(sk){
    var isHelm=sk.role==='helmsman';
    var ini=(sk.name||'').split(' ').map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase();

    /* split bookings: past vs future */
    var myAll=S.bookings.filter(function(b){ return (b.skippers||[]).includes(sk.name); });
    var past=myAll.filter(function(b){
      var d=b.dateISO?new Date(b.dateISO):null;
      return d&&d<today;
    }).sort(function(a,b){ return (b.dateISO||'').localeCompare(a.dateISO||''); }); /* newest first */
    var future=myAll.filter(function(b){
      var d=b.dateISO?new Date(b.dateISO):null;
      return !d||(d>=today);
    }).sort(function(a,b){ return (a.dateISO||'').localeCompare(b.dateISO||''); }); /* soonest first */

    var totalRev=myAll.reduce(function(s,b){return s+b.total;},0);
    var pastDays=new Set(past.map(function(b){return b.dateISO;})).size;
    var futureDays=new Set(future.map(function(b){return b.dateISO;})).size;

    /* ── person block ── */
    var block=h('div',{style:'background:#fff;border:1px solid #e2edf2;border-radius:16px;overflow:hidden;margin-bottom:1.5rem'});

    /* header bar */
    var hdr=h('div',{style:'background:'+(isHelm?'#fef3c7':'#1e3040')+';padding:1rem 1.5rem;display:flex;align-items:center;gap:1rem'});
    hdr.appendChild(h('div',{style:'width:44px;height:44px;border-radius:50%;background:'+(isHelm?'#fde68a':'rgba(255,255,255,.12)')+';display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:600;color:'+(isHelm?'#92400e':'#c8d8e0')+';flex-shrink:0'},[ini]));
    var hinfo=h('div',{style:'flex:1'});
    var hnrow=h('div',{style:'display:flex;align-items:center;gap:10px'});
    hnrow.appendChild(h('span',{style:'font-family:"Cormorant Garamond",serif;font-size:1.2rem;font-weight:400;color:'+(isHelm?'#92400e':'#c8d8e0')},[sk.name]));
    hnrow.appendChild(h('span',{style:'font-size:.68rem;padding:2px 8px;border-radius:50px;font-weight:500;background:'+(isHelm?'#fcd34d':'rgba(200,216,224,.2)')+';color:'+(isHelm?'#78350f':'#c8d8e0')},[isHelm?'Rorsman':'Skeppare']));
    if(sk.age) hnrow.appendChild(h('span',{style:'font-size:.75rem;color:'+(isHelm?'#b45309':'rgba(255,255,255,.45)')},[sk.age+' år']));
    hinfo.appendChild(hnrow);
    if(sk.notes) hinfo.appendChild(h('div',{style:'font-size:.75rem;color:'+(isHelm?'#b45309':'rgba(255,255,255,.4)')+';margin-top:3px;font-style:italic'},[sk.notes]));
    hdr.appendChild(hinfo);
    /* summary stats */
    var stats=h('div',{style:'display:flex;gap:1.5rem;flex-shrink:0'});
    [[pastDays,(pastDays===1?'dag':'dagar')+' jobbat'],[future.length,'framtida pass'],[totalRev.toLocaleString('sv-SE')+' kr','bokn.värde']].forEach(function(pair){
      var sc=h('div',{style:'text-align:right'});
      sc.appendChild(h('div',{style:'font-family:"Cormorant Garamond",serif;font-size:1.3rem;font-weight:600;color:'+(isHelm?'#92400e':'#c8d8e0')+';line-height:1'},[String(pair[0])]));
      sc.appendChild(h('div',{style:'font-size:.62rem;text-transform:uppercase;letter-spacing:.07em;color:'+(isHelm?'#b45309':'rgba(255,255,255,.4)')+';margin-top:2px'},[pair[1]]));
      stats.appendChild(sc);
    });
    hdr.appendChild(stats);
    block.appendChild(hdr);

    var inner=h('div',{style:'display:grid;grid-template-columns:1fr 1fr;gap:0'});

    /* ── PAST ── */
    var pastCol=h('div',{style:'padding:1.25rem;border-right:1px solid #f0f5f8'});
    var pastHead=h('div',{style:'display:flex;align-items:center;gap:8px;margin-bottom:10px'});
    pastHead.appendChild(h('div',{style:'font-size:.68rem;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:#7a7a76'},['Historik — '+past.length+' pass']));
    pastHead.appendChild(h('div',{style:'flex:1;height:1px;background:#e2edf2'}));
    pastCol.appendChild(pastHead);

    if(!past.length){
      pastCol.appendChild(h('div',{style:'font-size:.82rem;color:#7a7a76;font-style:italic;padding:4px 0'},['Inga genomförda pass']));
    } else {
      /* group past by date */
      var pastGrouped={};
      past.forEach(function(b){ var k=b.dateISO||'z'; if(!pastGrouped[k]) pastGrouped[k]=[]; pastGrouped[k].push(b); });
      Object.keys(pastGrouped).sort().reverse().forEach(function(iso){
        var dayBks=pastGrouped[iso];
        var dlbl=dayBks[0].date||iso;
        pastCol.appendChild(h('div',{style:'margin-bottom:10px'},[
          h('div',{style:'font-size:.72rem;font-weight:500;color:#4a7fa0;margin-bottom:4px'},[dlbl]),
          h('div',{style:'display:flex;flex-direction:column;gap:3px'},dayBks.map(function(b){
            var tc={'halvdag':'#4a7fa0','heldag':'#27ae60','kurs':'#8b5cf6','privat':'#f59e0b'}[b.type]||'#888';
            var tl={'halvdag':'Halvdag','heldag':'Heldag','kurs':'Kurs','privat':'Privat'}[b.type]||b.title;
            var row=h('div',{style:'display:flex;align-items:center;gap:6px;padding:5px 8px;background:#f9f7f4;border-radius:7px'});
            row.appendChild(h('span',{style:'font-size:.68rem;padding:1px 7px;border-radius:50px;background:'+tc+'22;color:'+tc+';white-space:nowrap'},[tl]));
            row.appendChild(h('span',{style:'font-size:.78rem;color:#2c2c2a;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'},[b.name]));
            row.appendChild(h('span',{style:'font-size:.7rem;color:#7a7a76;white-space:nowrap'},[b.time==='Förmiddag 09–13'?'FM':b.time==='Eftermiddag 14–18'?'EM':'HD']));
            row.appendChild(h('span',{style:'font-size:.72rem;font-weight:500;color:#1e3040;white-space:nowrap'},[b.persons+'p']));
            return row;
          }))
        ]));
      });
    }
    inner.appendChild(pastCol);

    /* ── FUTURE ── */
    var futCol=h('div',{style:'padding:1.25rem'});
    var futHead=h('div',{style:'display:flex;align-items:center;gap:8px;margin-bottom:10px'});
    futHead.appendChild(h('div',{style:'font-size:.68rem;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:#7a7a76'},['Kommande — '+future.length+' pass']));
    futHead.appendChild(h('div',{style:'flex:1;height:1px;background:#e2edf2'}));
    futCol.appendChild(futHead);

    if(!future.length){
      futCol.appendChild(h('div',{style:'font-size:.82rem;color:#7a7a76;font-style:italic;padding:4px 0'},['Inga kommande pass']));
    } else {
      var futGrouped={};
      future.forEach(function(b){ var k=b.dateISO||'z'; if(!futGrouped[k]) futGrouped[k]=[]; futGrouped[k].push(b); });
      Object.keys(futGrouped).sort().forEach(function(iso){
        var dayBks=futGrouped[iso];
        var dlbl=dayBks[0].date||iso;
        /* days until */
        var daysUntil=iso!=='z'?Math.round((new Date(iso)-today)/86400000):null;
        var dLabel=daysUntil===0?'Idag':daysUntil===1?'Imorgon':(daysUntil!==null?'Om '+daysUntil+' dagar':dlbl);
        futCol.appendChild(h('div',{style:'margin-bottom:10px'},[
          h('div',{style:'display:flex;align-items:center;justify-content:space-between;margin-bottom:4px'},[
            h('span',{style:'font-size:.72rem;font-weight:500;color:#4a7fa0'},[dlbl]),
            h('span',{style:'font-size:.68rem;padding:1px 8px;border-radius:50px;background:'+(daysUntil!==null&&daysUntil<=3?'#fef3c7':'#e2edf2')+';color:'+(daysUntil!==null&&daysUntil<=3?'#92400e':'#4a7fa0')},[dLabel])
          ]),
          h('div',{style:'display:flex;flex-direction:column;gap:3px'},dayBks.map(function(b){
            var tc={'halvdag':'#4a7fa0','heldag':'#27ae60','kurs':'#8b5cf6','privat':'#f59e0b'}[b.type]||'#888';
            var tl={'halvdag':'Halvdag','heldag':'Heldag','kurs':'Kurs','privat':'Privat'}[b.type]||b.title;
            var conf=b.confirmed;
            var row=h('div',{style:'display:flex;align-items:center;gap:6px;padding:6px 8px;background:'+(conf?'#f0fff4':'#fffbf0')+';border-radius:7px;border:1px solid '+(conf?'#d1fae5':'#fef3c7')});
            row.appendChild(h('span',{style:'font-size:.68rem;padding:1px 7px;border-radius:50px;background:'+tc+'22;color:'+tc+';white-space:nowrap'},[tl]));
            row.appendChild(h('span',{style:'font-size:.78rem;color:#2c2c2a;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'},[b.name]));
            row.appendChild(h('span',{style:'font-size:.7rem;color:#7a7a76;white-space:nowrap'},[b.time==='Förmiddag 09–13'?'FM':b.time==='Eftermiddag 14–18'?'EM':'HD']));
            row.appendChild(h('span',{style:'font-size:.72rem;font-weight:500;color:#1e3040;white-space:nowrap'},[b.persons+'p']));
            row.appendChild(h('span',{style:'font-size:.62rem;padding:1px 6px;border-radius:50px;background:'+(conf?'#d1fae5':'#fef3c7')+';color:'+(conf?'#065f46':'#92400e')},[conf?'✓':'?']));
            /* colleagues on this booking */
            var colls=(b.skippers||[]).filter(function(n){return n!==sk.name;});
            if(colls.length) row.appendChild(h('span',{style:'font-size:.68rem;color:#7a7a76;white-space:nowrap;margin-left:2px'},['+ '+colls.join(', ')]));
            return row;
          }))
        ]));
      });
    }
    inner.appendChild(futCol);
    block.appendChild(inner);
    wrap.appendChild(block);
  });
  return wrap;
}


/* ── Weather: Open-Meteo (free, no key, Celsius+wind) ── */
function fetchWeather(){
  var url='https://api.open-meteo.com/v1/forecast?latitude=63.40&longitude=13.08'
    +'&current=temperature_2m,weathercode,windspeed_10m,winddirection_10m,apparent_temperature'
    +'&wind_speed_unit=ms&timezone=Europe%2FStockholm';
  fetch(url).then(function(r){return r.json();}).then(function(data){
    var c=data.current;
    var temp=Math.round(c.temperature_2m);
    var feels=Math.round(c.apparent_temperature);
    var wind=Math.round(c.windspeed_10m*10)/10;
    var windDir=windDirLabel(c.winddirection_10m);
    var bft=msToBft(c.windspeed_10m);
    var code=c.weathercode;
    var icon=weatherIcon(code);
    var desc=weatherDesc(code);
    var box=document.getElementById('weather-box');
    if(!box) return;
    box.innerHTML=
      '<div style="font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:#4a7fa0;margin-bottom:6px">Åresjön just nu</div>'
      +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:5px">'
      +'<span style="font-size:1.5rem;line-height:1">'+icon+'</span>'
      +'<div>'
      +'<div style="font-size:1.2rem;font-weight:600;line-height:1;color:#1e3040">'+temp+'°C</div>'
      +'<div style="font-size:.68rem;color:#7a7a76;margin-top:1px">Känns som '+feels+'°</div>'
      +'</div></div>'
      +'<div style="border-top:1px solid rgba(74,127,160,.15);padding-top:5px;display:flex;align-items:center;gap:6px">'
      +'<span style="font-size:.85rem">💨</span>'
      +'<div>'
      +'<div style="font-size:.78rem;font-weight:500;color:#1e3040">'+wind+' m/s '+windDir+'</div>'
      +'<div style="font-size:.65rem;color:#7a7a76">Bft '+bft+' · '+desc+'</div>'
      +'</div></div>';
  }).catch(function(){
    var box=document.getElementById('weather-box');
    if(box) box.innerHTML='<div style="font-size:.6rem;color:#4a7fa0">Åresjön just nu</div><div style="font-size:.72rem;color:#7a7a76;margin-top:3px">Väder ej tillgängligt</div>';
  });
}

function windDirLabel(deg){
  var dirs=['N','NNO','NO','ONO','O','OSO','SO','SSO','S','SSV','SV','VSV','V','VNV','NV','NNV'];
  return dirs[Math.round(deg/22.5)%16];
}

function msToBft(ms){
  var t=[0.3,1.6,3.4,5.5,8.0,10.8,13.9,17.2,20.8,24.5,28.5,32.7];
  for(var i=0;i<t.length;i++) if(ms<t[i]) return i;
  return 12;
}

function weatherIcon(code){
  if(code===0) return '☀️';
  if(code<=2) return '⛅';
  if(code===3) return '☁️';
  if(code<=49) return '🌫️';
  if(code<=57) return '🌧️';
  if(code<=67) return '🌧️';
  if(code<=77) return '❄️';
  if(code<=82) return '🌦️';
  if(code<=86) return '🌨️';
  if(code<=99) return '⛈️';
  return '🌤️';
}

function weatherDesc(code){
  if(code===0) return 'Klart';
  if(code===1) return 'Mestadels klart';
  if(code===2) return 'Delvis molnigt';
  if(code===3) return 'Mulet';
  if(code<=45) return 'Dimma';
  if(code<=48) return 'Rimfrostdimma';
  if(code<=55) return 'Duggregn';
  if(code<=57) return 'Underkylt dugg';
  if(code<=65) return 'Regn';
  if(code<=67) return 'Underkylt regn';
  if(code<=75) return 'Snöfall';
  if(code<=77) return 'Snögryn';
  if(code<=82) return 'Regnskurar';
  if(code<=86) return 'Snöbyar';
  if(code<=99) return 'Åska';
  return 'Växlande';
}
